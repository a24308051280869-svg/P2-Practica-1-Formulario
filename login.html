<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Hace que la página se adapte al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · KEVLAR</title>
  <link rel="icon" href="img/logo.png">

  <!-- Fuentes de Google: Bebas Neue (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Scripts, EN ESTE ORDEN: motor SQL, base de datos, funciones de interfaz -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</head>
<body>

  <!-- ================= BARRA DE NAVEGACIÓN ================= -->
  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="img/logo.png" alt="Logo de KEVLAR">
        <b>KEV<span>LAR</span></b>
      </a>

      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="burger" aria-label="Menú"><span></span><span></span><span></span></label>

      <nav class="links">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="registrar.html">Registrar</a>
      </nav>

      <!-- app.js pone aquí el botón de sesión -->
      <div class="session" id="session"></div>
    </div>
  </header>

  <!-- Avisos de éxito o error (por ejemplo "Cuenta creada" o "Contraseña incorrecta") -->
  <div class="flashes" id="flashes"></div>

  <main>

    <!-- ================= FORMULARIO DE INICIO DE SESIÓN ================= -->
    <section class="auth">
      <div class="auth-card">
        <h1>Iniciar <span class="red">sesión</span></h1>
        <p class="muted">Ingresa con tu correo y contraseña.</p>

        <form id="form-login">
          <label>Correo electrónico
            <input type="email" name="email" required>
          </label>
          <label>Contraseña
            <input type="password" name="password" required>
          </label>
          <button class="btn btn-red btn-lg block" type="submit">Entrar</button>
        </form>

        <p class="alt">¿Aún no tienes cuenta? <a href="registrar.html">Regístrate</a></p>
      </div>
    </section>

  </main>

  <!-- ================= PIE DE PÁGINA =================
       Está vacío a propósito: la función footer() de js/app.js lo llena con
       el logo, el nombre KEVLAR y el código MME-0869 en todas las páginas. -->
  <footer class="footer" id="footer"></footer>

  <!-- ================= SCRIPT DE ESTA PÁGINA =================
       Al enviar el formulario busca en la base de datos un usuario con ese
       correo y esa contraseña (iniciarSesion en db.js). Si existe, guarda la
       sesión y manda al inicio; si no, muestra un error en rojo. -->
  <script>
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();                                   // no recargar la página
      document.getElementById('flashes').innerHTML = '';    // limpiar errores anteriores
      const f = new FormData(e.target);
      try {
        await initDB();
        const r = await iniciarSesion(String(f.get('email')).trim().toLowerCase(), f.get('password'));
        if (!r.ok) { mostrarMensaje('Correo o contraseña incorrectos.', 'error'); return; }
        guardarMensaje('Bienvenido, ' + r.usuario.nombre + '.', 'ok');
        location.href = 'index.html';
      } catch (err) {
        mostrarMensaje('No se pudo conectar con la base de datos (revisa tu conexión a internet).', 'error');
      }
    });
  </script>
</body>
</html>
